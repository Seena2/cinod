name: CI pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual runs from the GitHub Actions tab

# Cancels in-progress runs if a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # strategy:
    #   fail-fast: false
    #   matrix:
    #     node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24 # ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: 24 # ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      # - name: Run tests
      #   run: npm test --if-present

      # - name: Build project
      #   run: npm run build --if-present

      # Run both test and build at same time using the script we defined i package.json
      - name: test and build
        run: npm run verify
